# release.yml — the "CD" half. Builds the package and ships it as a
# GitHub Release whenever you push a version tag like v0.1.0.

name: Release

on:
  push:
    tags:
      - "v*"          # only runs for tags that start with "v" (v0.1.0, v1.2.3)

# The robot needs permission to CREATE a release in your repo.
# This grants it — no secret setup needed; GitHub provides the token.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build the installable files (.whl and .tar.gz) into dist/
      - name: Build the package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Attach those files to a new GitHub Release named after the tag.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
