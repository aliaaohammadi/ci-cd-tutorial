# docker.yml — CD with a SECRET. Builds a Docker image and pushes it to
# GitHub's Container Registry (ghcr.io) on every push to main.

name: Docker

on:
  push:
    branches: [main]

# The robot needs permission to upload a package to your account.
permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # THE SECRET STEP: log in to the registry with a credential.
      # ${{ secrets.GITHUB_TOKEN }} is a password GitHub creates and
      # injects automatically — it never appears in your code or logs.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}          # your username, auto-filled
          password: ${{ secrets.GITHUB_TOKEN }}  # the secret credential

      # Build the image from the Dockerfile and push it to the registry.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
